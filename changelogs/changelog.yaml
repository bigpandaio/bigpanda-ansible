releases:
  1.3.0:
    release_date: '2026-06-05'
    changes:
      release_summary: |
        Refresh for Ansible Automation Platform 2.5 / EDA. Modules now use
        ansible-core's built-in HTTP client (no external ``requests``
        dependency), correctly honor ``--check`` mode, and pass
        ``ansible-test sanity`` cleanly. The EDA rulebook has been rewritten
        to key on real BigPanda webhook fields and dispatch to AAP job
        templates instead of a debug stub.
      breaking_changes:
        - The ``resolve_alert`` module's ``comments`` parameter changed
          from ``type='list'`` to ``type='str'`` to match the documented
          ``POST /batch-resolve/alerts`` body schema. Any existing
          playbook passing a YAML list to ``comments`` will now fail
          Ansible argument validation and must be updated to pass a
          single string instead.
      major_changes:
        - Replaced ``requests`` with ``ansible.module_utils.urls.fetch_url``
          across all action modules. The collection no longer pulls in any
          out-of-tree Python dependency, which unblocks publishing to
          Automation Hub.
        - All module URL paths, HTTP methods, and request body schemas now
          match the documented BigPanda v2.0 REST API exactly.
        - Added an ``api_url`` parameter (default
          ``https://api.bigpanda.io``, env fallback
          ``BIGPANDA_API_URL``) to all action modules so the collection
          can target EU (``https://eu-api.bigpanda.io``) and dedicated
          BigPanda tenants. Use ``module_defaults`` to set it once per
          play.
        - Documented ``environment_id`` in every module's
          ``DOCUMENTATION`` block. The parameter was already declared
          ``required=True`` in ``argument_spec`` on the previous
          release, so this is a documentation fix, not a behavior
          change.
        - Rewrote ``extensions/eda/rulebooks/bigpanda-webhook.yml`` to match
          the documented BigPanda Notifications Webhook v2 payload shape.
          Rules now key on ``event.payload.incident.resolved``,
          ``event.payload.incident.active`` and
          ``event.payload.incident.status``, and dispatch to
          ``run_job_template`` with ``incident_id`` / ``environment_id``
          sourced from ``event.payload.incident.id`` and
          ``event.payload.metadata.environment_id``.
      bugfixes:
        - Fixed ``--check`` mode in all modules. They previously declared
          ``supports_check_mode=True`` but still issued the live HTTP
          request, violating Ansible's check-mode contract. In check mode
          they now return the ``url``, ``method``, and ``payload`` that
          would have been sent, without touching the network.
        - Marked ``api_token`` as ``no_log=True`` so it is redacted from
          task output and the ``-v`` log.
        - Tightened ``galaxy.yml`` ``build_ignore`` to exclude ``.venv``,
          ``collections/``, ``.idea``, and ``*.tar.gz``. Without this the
          collection tarball ballooned to 48MB and ``ansible-test sanity``
          ended up scanning vendored pip packages.
